services:
  postgres:
    image: postgres:15-alpine
    container_name: umlforge_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umlforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umlforge_password}
      POSTGRES_DB: ${POSTGRES_DB:-umlforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umlforge} -d ${POSTGRES_DB:-umlforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
