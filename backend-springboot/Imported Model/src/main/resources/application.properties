spring.application.name=Imported Model

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/Imported Model_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Inicialización por SQL scripts explícitos
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# Desactivar auto-carga de data.sql vacío por defecto
spring.sql.init.data-locations=
# spring.sql.init.data-locations=classpath:data.sql (uncomment to enable seed data)

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html