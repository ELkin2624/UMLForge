[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parcial1-sw1"
version = "0.1.0"
description = "Herramienta CASE Colaborativa - Fase 1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.1",
    "lxml>=5.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "mypy",
    "httpx",
    "types-lxml>=2024.0.0"
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["B008", "BLE001", "S110", "RUF012"]

[tool.mypy]
strict = true

[tool.setuptools.packages.find]
where = ["packages"]
